- id: q009
  category: subquery_cte_window
  difficulty: hard
  lang: es
  question: ¿Qué entidad contratante tiene el mayor monto adjudicado en cada provincia?
  gold_sql: WITH spend AS (SELECT b.province, b.buyer_name, SUM(a.amount_usd) AS total_usd FROM awards a JOIN tenders t ON t.tender_id = a.tender_id JOIN buyers b ON b.buyer_id = t.buyer_id WHERE b.province IS NOT NULL GROUP BY b.province, b.buyer_name), ranked AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY province ORDER BY total_usd DESC, buyer_name) AS rn FROM spend) SELECT province, buyer_name, total_usd FROM ranked WHERE rn = 1 ORDER BY province
  pair_id: null
  expect: answer
  tags:
  - anchor
  - window
  - ranking
  notes: ''
