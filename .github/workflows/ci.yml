name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict src

      - name: Import contracts
        run: uv run lint-imports

      - name: Lockfile
        run: uv lock --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
          - os: windows-latest
            python-version: "3.12"
            coverage: false
          - os: macos-latest
            python-version: "3.12"
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests with coverage gate
        if: matrix.coverage
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-fail-under=85

      - name: Tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m "not e2e"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests
        run: uv run pytest -m e2e

  eval-gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Replay benchmark and compare with the baseline
        run: uv run sqlagent eval --llm replay --compare eval/baseline.json --out eval/ci-report

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-ci-report
          path: eval/ci-report
          if-no-files-found: warn

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Build wheel and sdist
        run: uv build

      - name: Install from wheel and run offline smoke
        env:
          PYTHONUTF8: "1"
        run: uv run python scripts/smoke_install.py

      - name: README quickstart serve check (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHONUTF8: "1"
          SQLAGENT_DATA_DIR: ${{ runner.temp }}/sqlagent-quickstart-data
        run: |
          set -euo pipefail
          uv tool install --force dist/*.whl
          bin_dir=$(uv tool dir --bin)
          export PATH="$bin_dir:$PATH"
          log="$RUNNER_TEMP/serve.log"
          sqlagent serve --demo > "$log" 2>&1 &
          serve_pid=$!
          status=000
          for _ in $(seq 1 120); do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              cat "$log"
              echo "sqlagent serve exited before /health answered" >&2
              exit 1
            fi
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17080/health || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 1
          done
          kill "$serve_pid" 2>/dev/null || true
          wait "$serve_pid" 2>/dev/null || true
          echo "GET /health -> $status"
          if [ "$status" != "200" ]; then
            cat "$log"
            exit 1
          fi
          uv tool uninstall local-sql-analyst-agent

      - name: README quickstart serve check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          SQLAGENT_DATA_DIR: ${{ runner.temp }}\sqlagent-quickstart-data
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = (Get-ChildItem -Path dist -Filter *.whl).FullName
          uv tool install --force $wheel
          $cli = Join-Path (uv tool dir --bin) "sqlagent.exe"
          $log = Join-Path $env:RUNNER_TEMP "serve.log"
          $serve = Start-Process -FilePath $cli -ArgumentList "serve", "--demo" -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $status = 0
          for ($i = 0; $i -lt 120; $i++) {
            if ($serve.HasExited) {
              Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
              throw "sqlagent serve exited before /health answered"
            }
            try {
              $status = [int](Invoke-WebRequest -Uri "http://127.0.0.1:17080/health" -UseBasicParsing -TimeoutSec 2).StatusCode
            } catch {
              $status = 0
            }
            if ($status -eq 200) { break }
            Start-Sleep -Seconds 1
          }
          taskkill /T /F /PID $serve.Id | Out-Null
          Write-Output "GET /health -> $status"
          if ($status -ne 200) {
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            throw "GET /health returned $status"
          }
          uv tool uninstall local-sql-analyst-agent

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project -o audit.txt

      - name: Dependency audit
        run: uvx pip-audit -r audit.txt --disable-pip --no-deps
