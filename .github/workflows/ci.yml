name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict src

      - name: Import contracts
        run: uv run lint-imports

      - name: Lockfile
        run: uv lock --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
          - os: windows-latest
            python-version: "3.12"
            coverage: false
          - os: macos-latest
            python-version: "3.12"
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests with coverage gate
        if: matrix.coverage
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-fail-under=85

      - name: Tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m "not e2e"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests
        run: uv run pytest -m e2e

  eval-gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Replay benchmark and compare with the baseline
        run: uv run sqlagent eval --llm replay --compare eval/baseline.json --out eval/ci-report

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-ci-report
          path: eval/ci-report
          if-no-files-found: warn

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Build wheel and sdist
        run: uv build

      - name: Install from wheel and run offline smoke
        env:
          PYTHONUTF8: "1"
        run: uv run python scripts/smoke_install.py

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project -o audit.txt

      - name: Dependency audit
        run: uvx pip-audit -r audit.txt --disable-pip --no-deps
