name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict src

      - name: Import contracts
        run: uv run lint-imports

      - name: Lockfile
        run: uv lock --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
          - os: windows-latest
            python-version: "3.12"
            coverage: false
          - os: macos-latest
            python-version: "3.12"
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests with coverage gate
        if: matrix.coverage
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-fail-under=85

      - name: Tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m "not e2e"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project -o audit.txt

      - name: Dependency audit
        run: uvx pip-audit -r audit.txt --disable-pip --no-deps
