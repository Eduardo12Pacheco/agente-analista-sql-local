# Legitimate analytic SQL corpus for SqlPolicy (T3, S16/D14).
# Every entry must be accepted and returned with a top-level LIMIT <= 1000.
- "SELECT COUNT(*) AS n FROM tenders"
- "SELECT SUM(amount_usd) AS total_awarded_usd FROM awards"
- "SELECT COUNT(*) AS n FROM tenders WHERE status = 'active'"
- "SELECT COUNT(*) AS n FROM tenders WHERE category = 'works' AND is_competitive IS TRUE"
- "SELECT b.province, COUNT(*) AS n FROM tenders t JOIN buyers b ON b.buyer_id = t.buyer_id WHERE b.province IS NOT NULL GROUP BY b.province ORDER BY n DESC, b.province LIMIT 5"
- "SELECT s.supplier_name, SUM(a.amount_usd) AS total_usd FROM awards a JOIN suppliers s ON s.supplier_id = a.supplier_id GROUP BY s.supplier_id, s.supplier_name ORDER BY total_usd DESC NULLS LAST, s.supplier_id LIMIT 10"
- "SELECT date_trunc('month', release_date) AS month, COUNT(*) AS n FROM tenders GROUP BY 1 ORDER BY 1"
- "SELECT ROUND(100.0 * AVG(CASE WHEN is_competitive THEN 1 ELSE 0 END), 2) AS pct_competitive FROM tenders"
- "WITH spend AS (SELECT b.province, b.buyer_name, SUM(a.amount_usd) AS total_usd FROM awards a JOIN tenders t ON t.tender_id = a.tender_id JOIN buyers b ON b.buyer_id = t.buyer_id WHERE b.province IS NOT NULL GROUP BY b.province, b.buyer_name), ranked AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY province ORDER BY total_usd DESC, buyer_name) AS rn FROM spend) SELECT province, buyer_name, total_usd FROM ranked WHERE rn = 1 ORDER BY province"
- "SELECT COUNT(*) AS n FROM tenders t JOIN buyers b ON b.buyer_id = t.buyer_id WHERE b.buyer_name = 'INSTITUTO ECUATORIANO DE SEGURIDAD SOCIAL'"
- "SELECT t.category, AVG(t.planned_amount_usd) AS avg_planned FROM tenders t WHERE t.planned_amount_usd IS NOT NULL AND t.release_date >= DATE '2021-01-01' AND t.release_date < DATE '2021-07-01' GROUP BY t.category HAVING COUNT(*) > 10 ORDER BY avg_planned DESC NULLS LAST"
- "SELECT t.procurement_type, COUNT(*)::DOUBLE / (SELECT COUNT(*) FROM tenders) AS share FROM tenders t GROUP BY t.procurement_type ORDER BY share DESC"
- "SELECT * FROM (SELECT tender_id, amount_usd FROM awards WHERE amount_usd > 1000) q WHERE q.amount_usd < 100000 ORDER BY q.amount_usd DESC LIMIT 10"
- "SELECT buyer_id FROM tenders EXCEPT SELECT buyer_id FROM buyers ORDER BY 1"
- "SELECT buyer_id FROM tenders INTERSECT SELECT buyer_id FROM buyers ORDER BY 1"
- "SELECT buyer_id FROM tenders UNION SELECT buyer_id FROM buyers ORDER BY 1 LIMIT 3"
- "SELECT supplier_name, CASE WHEN supplier_kind = 'company' THEN 'Empresa' WHEN supplier_kind = 'natural_person' THEN 'Persona natural' ELSE 'Otro' END AS kind_es FROM suppliers ORDER BY supplier_name LIMIT 20"
- "SELECT a.award_id, LAG(a.amount_usd) OVER (PARTITION BY a.tender_id ORDER BY a.award_id) AS prev_amount FROM awards a QUALIFY prev_amount IS NOT NULL ORDER BY a.award_id LIMIT 20"
- "SELECT province, COUNT(*) AS n FROM buyers WHERE province IN ('GUAYAS', 'PICHINCHA') GROUP BY province ORDER BY n DESC"
- "SELECT supplier_name FROM suppliers WHERE lower(supplier_name) LIKE '%constructora%' ORDER BY supplier_name LIMIT 10"
- "SELECT COUNT(DISTINCT supplier_id) AS n FROM awards"
- "SELECT median(amount_usd) AS median_amount FROM awards WHERE amount_usd IS NOT NULL"
- "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY amount_usd) AS p50 FROM awards"
- "SELECT strftime(release_date, '%Y-%m') AS month, COUNT(*) AS n FROM tenders GROUP BY 1 ORDER BY 1"
- "SELECT EXTRACT(YEAR FROM release_date) AS y, COUNT(*) AS n FROM tenders GROUP BY 1 ORDER BY 1"
- "SELECT release_date + INTERVAL 1 DAY AS next_day FROM tenders LIMIT 5"
- "SELECT CAST(amount_usd AS DECIMAL(18, 2)) AS amount FROM awards WHERE amount_usd IS NOT NULL"
- "SELECT COALESCE(province, 'DESCONOCIDA') AS province, COUNT(*) AS n FROM buyers GROUP BY 1 ORDER BY 2 DESC"
- "SELECT t.title, b.buyer_name FROM tenders t LEFT JOIN buyers b ON b.buyer_id = t.buyer_id WHERE t.title ILIKE '%hospital%' ORDER BY t.release_date DESC LIMIT 20"
- "SELECT buyer_name, ROW_NUMBER() OVER (ORDER BY buyer_name) AS rn FROM buyers QUALIFY rn <= 5"
- "SELECT tender_id, amount_usd, NTILE(4) OVER (ORDER BY amount_usd) AS quartile FROM awards WHERE amount_usd IS NOT NULL QUALIFY quartile = 1 LIMIT 10"
- "SELECT tender_id FROM tenders WHERE release_date BETWEEN DATE '2021-01-01' AND DATE '2021-12-31' AND is_competitive IS TRUE ORDER BY release_date LIMIT 20"
- "SELECT b.province, SUM(a.amount_usd) FILTER (WHERE a.status = 'active') AS active_amount, SUM(a.amount_usd) AS total_amount FROM awards a JOIN tenders t ON t.tender_id = a.tender_id JOIN buyers b ON b.buyer_id = t.buyer_id GROUP BY b.province ORDER BY total_amount DESC NULLS LAST LIMIT 24"
- "SELECT x.buyer_name FROM (SELECT buyer_name FROM buyers) AS x ORDER BY x.buyer_name LIMIT 3"
- "SELECT COUNT(*) AS n, COUNT(*) FILTER (WHERE is_competitive) AS competitive FROM tenders"
- "SELECT tender_id, (SELECT MAX(amount_usd) FROM awards a WHERE a.tender_id = t.tender_id) AS max_award FROM tenders t ORDER BY tender_id LIMIT 10"
- "SELECT * FROM main.tenders LIMIT 5"
- "SELECT * FROM \"tenders\" LIMIT 5"
- "SELECT * FROM tenders; -- trailing comment"
- "/* leading comment */ SELECT * FROM tenders"
- "SELECT buyer_id FROM tenders WHERE EXISTS (SELECT 1 FROM awards a WHERE a.tender_id = tenders.tender_id) ORDER BY buyer_id LIMIT 10"
- "SELECT buyer_id FROM tenders WHERE buyer_id NOT IN (SELECT buyer_id FROM buyers) ORDER BY buyer_id"
- "SELECT nullif(amount_usd, 0) AS amount, abs(-1) AS one, round(sqrt(power(2, 2)), 2) AS two FROM awards WHERE amount_usd IS NOT NULL LIMIT 5"
- "SELECT string_agg(DISTINCT category, ',') AS categories FROM tenders"
- "SELECT arg_max(buyer_name, buyer_id) AS last_buyer FROM buyers"
- "SELECT date_diff('day', DATE '2021-01-01', release_date) AS days FROM tenders LIMIT 5"
- "SELECT make_date(2021, 1, 1) AS start_date, age(DATE '2021-12-31', DATE '2021-01-01') AS span"
- "SELECT * FROM tenders WHERE regexp_matches(title, 'hospital|salud') LIMIT 10"
- "SELECT list(category) AS categories FROM tenders GROUP BY buyer_id"
- "SELECT * FROM (VALUES (1, 'a'), (2, 'b')) AS v(id, label) ORDER BY id"
- "WITH monthly AS (SELECT date_trunc('month', release_date) AS month, COUNT(*) AS n FROM tenders GROUP BY 1) SELECT month, n FROM monthly ORDER BY month LIMIT 12"
- "SELECT buyer_id, COUNT(*) AS n FROM tenders GROUP BY buyer_id HAVING COUNT(*) > 5 ORDER BY n DESC, buyer_id LIMIT 10"
- "SELECT * FROM tenders ORDER BY release_date DESC LIMIT 5000"
